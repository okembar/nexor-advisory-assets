<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<title>NEXOR — Carte de Visite Verso</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',Arial,sans-serif;background:#060411;color:#fff}
.band{height:3px;background:linear-gradient(90deg,#5B21B6,#7C3AED,#F97316,#22D3EE,#FCD34D)}
.sec{padding:60px 48px;border-bottom:1px solid rgba(124,58,237,.1)}
.wrap{max-width:1040px;margin:0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.bx{border-radius:16px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.bv{background:#0D0820;border:1px solid #2D1657}
.bd{background:#130926;border:1px solid #2D1657}
.bm{background:#1E0F3F;border:1px solid #3D2070}
.bl{background:#FAFAF9;border:1px solid #E9D5FF}
.cat{font-size:9px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#7C3AED;margin-bottom:8px}
.cap{font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#7C6FAF;text-align:center;margin-top:6px}
.bt{font-size:11px;color:#A78BFA;line-height:1.85}
.bt strong{color:#fff;font-weight:600}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.rule{display:flex;gap:10px;font-size:11px;color:#A78BFA;line-height:1.7;margin-bottom:10px;align-items:flex-start}
.rule::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.do::before{background:#10B981}.dn::before{background:#EF4444}.dn{color:#6B5B7A}
.sw{border-radius:10px;overflow:hidden;border:1px solid #2D1657}
.swc{height:44px}.swi{padding:8px 11px;background:#130926}
.swn{font-size:10px;font-weight:700;color:#fff;margin-bottom:1px}
.swh{font-size:9px;font-family:monospace;color:#7C6FAF}
.swu{font-size:8px;color:#4A3A6A;margin-top:2px;line-height:1.4}
.code{background:#0D0820;border-radius:8px;padding:14px 18px;font-family:monospace;font-size:10px;line-height:1.9;color:#22D3EE;border-left:2px solid #7C3AED}
a{color:#22D3EE;text-decoration:none}

body{background:#ddd;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{width:340px;height:216px;background:linear-gradient(145deg,#0D0820,#1A0A35,#0D0820);border-radius:10px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 90% 90% at 50% 50%,rgba(124,58,237,.12) 0%,transparent 65%);pointer-events:none}
</style></head><body>
<div class="card">
  <div style="height:3px;background:linear-gradient(90deg,#5B21B6,#7C3AED,#F97316,#22D3EE,#FCD34D)"></div>
  <div style="height:calc(100% - 6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:14px;position:relative;z-index:1">
    <svg viewBox="0 0 80 100" width="44" height="55" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gacv" x1="0" y1="0" x2="44" y2="55" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#5B21B6"/><stop offset="38%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#F97316"/></linearGradient></defs><path d="M0,0 L0,100 L14,100 L14,22 L66,100 L80,100 L80,0 L66,0 L66,78 L14,0 Z" fill="url(#gacv)"/><polygon points="40,44 47,51 40,58 33,51" fill="#FCD34D"/></svg>
    <div style="font-size:28px;font-weight:900;letter-spacing:10px;color:#fff;margin-top:6px">NEXOR</div>
    <div style="height:1px;width:72px;background:linear-gradient(90deg,transparent,#7C3AED,#F97316,transparent);margin:2px auto"></div>
    <div style="font-size:7.5px;font-weight:300;letter-spacing:3px;color:#A78BFA;text-transform:uppercase;text-align:center">Conseil · Infrastructure · Intelligence</div>
    <div style="display:flex;gap:10px;margin-top:5px">
      <span style="background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.25);border-radius:12px;padding:2px 8px;font-size:5.5px;font-weight:600;letter-spacing:1px;color:#A78BFA;text-transform:uppercase">Conseil IT</span>
      <span style="background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.2);border-radius:12px;padding:2px 8px;font-size:5.5px;font-weight:600;letter-spacing:1px;color:#FB923C;text-transform:uppercase">Automatisation IA</span>
      <span style="background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.15);border-radius:12px;padding:2px 8px;font-size:5.5px;font-weight:600;letter-spacing:1px;color:#67E8F9;text-transform:uppercase">NetForge AI</span>
    </div>
    <div style="font-size:6.5px;color:#3D2A52;letter-spacing:2px;margin-top:4px">nexoradvisory.fr</div>
  </div>
  <div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#5B21B6,#7C3AED,#F97316,#22D3EE,#FCD34D)"></div>
</div>
</body></html>
